security:
    providers:
        app_users:
            id: App\Infrastructure\Security\UserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build|build-e2e)/
            security: false
        integrations:
            pattern: ^/integrations/
            stateless: true
            provider: app_users
            access_token:
                token_handler: App\Infrastructure\Security\IntegrationTokenHandler
        main:
            lazy: true
            provider: app_users
            entry_point: App\Presentation\Web\Security\AuthenticationEntryPoint
            custom_authenticators:
                - App\Infrastructure\Security\Accounts\AccountsAuthenticator
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000
                always_remember_me: true
                signature_properties: [email]
            logout:
                path: logout
                target: login
                enable_csrf: true

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/manifest\.webmanifest$, roles: PUBLIC_ACCESS }
        - { path: ^/sw\.js$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }
