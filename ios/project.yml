name: MossyDew
options:
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    MOSSYDEW_BUNDLE_ID: studio.mossyleaf.mossydew
    MOSSYDEW_APP_GROUP: &appGroup group.studio.mossyleaf.mossydew
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  MossyDew:
    type: application
    platform: iOS
    sources:
      - MossyDew
      - Shared
    dependencies:
      - target: TodayWidget
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MOSSYDEW_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/MossyDew/Info.plist
      properties:
        CFBundleDisplayName: MossyDew
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        MossyDewAppGroup: *appGroup
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - mossydew
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Generated/MossyDew/MossyDew.entitlements
      properties:
        com.apple.security.application-groups:
          - *appGroup
  TodayWidget:
    type: app-extension
    platform: iOS
    sources:
      - TodayWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MOSSYDEW_BUNDLE_ID).TodayWidget
    info:
      path: Generated/TodayWidget/Info.plist
      properties:
        CFBundleDisplayName: MossyDew
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MossyDewAppGroup: *appGroup
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/TodayWidget/TodayWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - *appGroup
